name: Classroom Live Lab - Real Error Recovery

on:
  workflow_dispatch:

run-name: Classroom real error recovery

permissions:
  contents: read
  id-token: write

concurrency:
  group: neon-classroom-demo-exclusive
  cancel-in-progress: false

jobs:
  test-errors:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Obtain scoped Neon Lab credential
        run: python -m pipeline.oidc_lab_auth
      - name: Install pipeline dependencies
        run: python -m pip install -r requirements-neon.txt
      - name: Run isolated failure fix retry and Neon rollback check
        run: python -m pipeline.ci_lab_error
      - name: Publish test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classroom-error-result
          path: output/classroom_error_result.json
          if-no-files-found: warn
          retention-days: 30
