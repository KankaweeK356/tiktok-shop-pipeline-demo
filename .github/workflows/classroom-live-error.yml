name: Classroom Live Lab - Error Detection and Recovery

on:
  workflow_dispatch:
    inputs:
      case:
        description: Error Lab scenario
        required: true
        type: choice
        options: [N01, E01, E02, T01, T02, L01]
      phase:
        description: Detection or explicit recovery
        required: true
        type: choice
        options: [fail, fix]
      previous_run_id:
        description: Detection run ID for recovery phase
        required: true
        type: string

run-name: Classroom Error ${{ inputs.case }} / ${{ inputs.phase }} / previous ${{ inputs.previous_run_id }}

permissions:
  contents: read
  id-token: write

concurrency:
  group: neon-classroom-demo-exclusive
  cancel-in-progress: false

jobs:
  test-error:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Obtain scoped Neon Lab credential
        run: python -m pipeline.oidc_lab_auth
      - name: Install pipeline dependencies
        run: python -m pip install -r requirements-neon.txt
      - name: Run selected Error Lab phase
        run: python -m pipeline.ci_lab_error --case "${{ inputs.case }}" --phase "${{ inputs.phase }}"
      - name: Publish Error Lab evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classroom-error-result
          path: output/classroom_error_result.json
          if-no-files-found: warn
          retention-days: 30
