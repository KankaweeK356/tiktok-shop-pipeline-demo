name: Decision Dashboard - Source-backed Demo and Static Checks

on:
  pull_request:
    paths:
      - 'dashboard/**'
      - 'pipeline/export_dashboard.py'
      - 'tests/test_dashboard.py'
      - 'vercel.json'
      - '.github/workflows/decision-dashboard-ci.yml'
      - 'api/**'
      - 'lib/**'
      - 'pipeline/ci_lab_stage.py'
      - 'pipeline/ci_lab_batch.py'
      - 'pipeline/ci_lab_export.py'
      - 'pipeline/ci_lab_error.py'
      - '.github/workflows/classroom-real-step.yml'
      - '.github/workflows/classroom-live-batch.yml'
      - '.github/workflows/classroom-live-error.yml'
      - '.github/workflows/classroom-live-reset.yml'
      - 'tests/test_real_lab.py'
      - 'tests/test_lab_publisher.py'
      - 'pipeline/publish_lab_result.py'
      - 'pipeline/oidc_lab_auth.py'
      - '.github/workflows/classroom-push-step.yml'
      - 'pipeline/ci_neon_run.py'
      - 'pipeline/neon_control.py'
      - 'pipeline/neon_reset.py'
      - 'pipeline/archive_recovery.py'
      - 'pipeline/neon_source.py'
      - 'tests/test_neon_control_contracts.py'
      - 'tests/test_pipeline_lab.py'
      - 'pipeline/archive_warehouse_preview.py'
      - 'sql/neon_er1_demo_bootstrap.sql'
  workflow_dispatch:

concurrency:
  group: dashboard-evidence-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Only trusted same-repository PRs get a write-capable token.
permissions:
  contents: write

jobs:
  dashboard-evidence:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install ETL and ML dependencies
        run: python -m pip install -r requirements-ml.txt
      - name: Generate Source and reconcile Database Lake Warehouse
        run: python -m pipeline.ci_ml_history
      - name: Train weekly ML models Serving and Monitoring
        run: python -m pipeline.ci_ml_weekly_demo
      - name: Export verified static report
        run: python -m pipeline.export_dashboard --output dashboard/data/report.json
      - name: Verify six controlled failure-retry-replay cases (offline, isolated)
        run: python -c "from pipeline.demo_tests import error_suite; from pipeline.schema import ROOT; d=error_suite(ROOT/'output'/'test'); assert len(d)==6 and d['passed'].all()"
      - name: Export Data Explorer evidence from generated local-engine pipeline
        run: python -c "from pathlib import Path; from pipeline.classroom_evidence import export_classroom_evidence; export_classroom_evidence(Path('output/ml_history_ci/main'),Path('dashboard/data/classroom_evidence.json'))"
      - name: Verify Neon source adapter contracts without cloud credentials
        run: python -m pytest -q tests/test_neon_source.py tests/test_neon_control_contracts.py tests/test_real_lab.py tests/test_lab_publisher.py
      - name: Test KPIs provenance, interactive Lab and security
        run: python -m pytest -q tests/test_dashboard.py tests/test_pipeline_lab.py
      - name: Validate frontend JavaScript and Vercel config
        run: |
          node --check dashboard/app.js
          node --check api/neon-evidence.js
          node --check api/neon-status.js
          node --check api/storage-presign.js
          node --check api/lab-step.js
          node --check api/lab-dispatch.js
          node --check api/lab-real-result.js
          node --check api/lab-oidc.js
          node --check api/lab-batch.js
          node --check api/lab-batch-result.js
          node --check lib/lab-ml.js
          node --check lib/lab-warehouse-download.js
          node --check api/lab-error.js
          node --check api/lab-reset.js
          python -m py_compile pipeline/oidc_lab_auth.py pipeline/publish_lab_result.py
          python -m py_compile pipeline/ci_lab_batch.py pipeline/ci_lab_export.py pipeline/ci_lab_error.py
          python -c "import json;from pathlib import Path; p=json.loads(Path('vercel.json').read_text()); assert p['outputDirectory']=='dashboard'; assert Path('dashboard/data/report.json').is_file()"
      - name: Commit generated snapshot for the static frontend
        if: github.event_name == 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dashboard/data/report.json dashboard/data/classroom_evidence.json
          if ! git diff --cached --quiet; then
            git commit -m 'data(dashboard): refresh validated synthetic snapshot'
            git push origin "HEAD:$GITHUB_HEAD_REF"
          fi
      - name: Upload tested frontend and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-decision-dashboard-demo-evidence
          path: |
            dashboard/
            output/ml_history_ci/main/reports/ml_weekly/weekly_test_metrics.csv
            output/ml_history_ci/main/reports/ml_weekly/weekly_backtest_summary.json
            output/ml_history_ci/main/reports/functional_incremental.json
          if-no-files-found: warn
          retention-days: 14
