name: Feature Store - Test Python and DuckDB Adapter

on:
  pull_request:
    paths:
      - 'pipeline/ml_features.py'
      - 'tests/test_ml_features.py'
      - '.github/workflows/ml-feature-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feature-store-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install project dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Verify feature builder and DuckDB adapter
        run: python -m pytest -q tests/test_ml_features.py

