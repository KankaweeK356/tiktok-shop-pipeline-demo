name: ML Historical Mock - Full Data Pipeline

on:
  push:
    branches:
      - feature/classroom-demo-evidence-foundation
    paths:
      - 'pipeline/generate_ml_history.py'
      - 'pipeline/ci_ml_history.py'
      - 'pipeline/generate_classroom_source.py'
      - 'pipeline/ci_classroom_source.py'
      - 'pipeline/ml_weekly.py'
      - 'pipeline/ml_weekly_serve.py'
      - 'pipeline/ml_scenarios.py'
      - 'notebooks/TikTok_Shop_Step_by_Step_Demo.ipynb'
      - 'notebooks/TikTok_Shop_ML_Study.ipynb'
      - '.github/workflows/ml-history-ci.yml'
  pull_request:
    paths:
      - 'pipeline/generate_ml_history.py'
      - 'pipeline/ci_ml_history.py'
      - 'pipeline/transform.py'
      - 'pipeline/quality.py'
      - 'pipeline/generate_classroom_source.py'
      - 'pipeline/ci_classroom_source.py'
      - 'pipeline/ml_scenarios.py'
      - 'notebooks/TikTok_Shop_Step_by_Step_Demo.ipynb'
      - 'notebooks/TikTok_Shop_ML_Study.ipynb'
      - 'tests/test_ml_history.py'
      - '.github/workflows/ml-history-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history-to-warehouse:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify deterministic generator and short-range ETL
        run: python -m pytest -q tests/test_ml_history.py tests/test_ml_features.py
      - name: Generate full 12-month mock and run it through Database Lake Warehouse
        run: python -m pipeline.ci_ml_history
      - name: Preserve source, marketing plans, and ML-ready validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-12-month-synthetic-ml-history
          path: |
            output/ml_history_ci/source/
            output/ml_history_ci/main/reports/ml_history_*.csv
            output/ml_history_ci/main/reports/ml_history_summary.json
            output/ml_history_ci/main/reports/functional_*.json
          if-no-files-found: warn
          retention-days: 14
  classroom-ten-month-deliveries:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-ml.txt
      - name: Validate Colab notebook structure and Python cells
        run: |
          python - <<'PY'
          import nbformat
          for path in ('notebooks/TikTok_Shop_Step_by_Step_Demo.ipynb',
                       'notebooks/TikTok_Shop_ML_Study.ipynb'):
              notebook=nbformat.read(path,as_version=4)
              nbformat.validate(notebook)
              for index,cell in enumerate(notebook.cells):
                  if cell.cell_type=='code':
                      compile(cell.source,f'{path}:cell{index}','exec')
              print(path, 'valid')
          PY
      - name: Run all Source deliveries and verify clear
        run: python -m pipeline.ci_classroom_source
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classroom-ten-month-deliveries-check
          path: output/classroom_ci_result.json
          if-no-files-found: warn
          retention-days: 14
