name: Neon Classroom Demo - Confirmed Reset Only

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type exactly RESET-DEMO-DATA; this removes demo_er1 rows only"
        required: true
        type: string
      expected_cycle:
        description: "Current cycle in Neon; must match to prevent stale reset"
        required: true
        type: number
      reason:
        description: "Why the demo needs to be reset"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: neon-classroom-demo-exclusive
  cancel-in-progress: false

jobs:
  confirmed-reset:
    if: ${{ inputs.confirmation == 'RESET-DEMO-DATA' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEON_DEMO_DATABASE_URL: ${{ secrets.NEON_DEMO_DATABASE_URL }}
      RESET_REASON: ${{ inputs.reason }}
      RESET_CONFIRMATION: ${{ inputs.confirmation }}
      RESET_CYCLE: ${{ inputs.expected_cycle }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Neon PostgreSQL driver
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Confirm cycle and atomically clear only demo source rows
        run: python -m pipeline.neon_reset --confirm "$RESET_CONFIRMATION" --expected-cycle "$RESET_CYCLE" --reason "$RESET_REASON"
