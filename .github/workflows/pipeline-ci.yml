
name: Pipeline CI - Real DuckDB and PyArrow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Install actual DuckDB and PyArrow
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -c "import duckdb, pyarrow; print(duckdb.__version__, pyarrow.__version__)"

      - name: Regression tests
        run: python -m pytest -q tests/

      - name: Test actual Colab notebook sections 00-05
        run: python -m pipeline.ci_notebook

      - name: Test step-by-step Source to ER1 Lake ER2 and Incremental Demo
        run: python -m pipeline.ci_step_demo

      - name: Full Pipeline and business results
        run: python -m pipeline.ci_smoke

      - name: Preserve actual run reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-pipeline-actual-test-reports
          path: |
            output/github_report_upload.zip
            output/main/reports/
            output/test/error_suite_summary.csv
            output/performance/performance_summary.csv
          if-no-files-found: warn
          retention-days: 14

